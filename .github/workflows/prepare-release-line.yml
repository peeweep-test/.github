name: Prepare release line

on:
  workflow_dispatch:
    inputs:
      release_line:
        description: 已合并配置的 G2 发布线 ID
        required: true
        type: string
      dry_run:
        description: 只读全部预检与实际就绪状态
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: prepare-release-line-${{ inputs.release_line }}
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Create installation token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-actions: write
          permission-contents: write
          permission-pull-requests: read
          permission-administration: read

      - name: Try Administration Write for protection
        id: admin_token
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-actions: write
          permission-contents: write
          permission-pull-requests: read
          permission-administration: write

      - name: Checkout trusted template default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Checkout trusted dde default branch
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/dde
          token: ${{ steps.app_token.outputs.token }}
          path: coordinator
          persist-credentials: false

      - name: Install deps
        run: pip install --quiet pyyaml

      - name: Prepare and verify G2 members
        env:
          GH_TOKEN: ${{ steps.admin_token.outputs.token || steps.app_token.outputs.token }}
          APP_ID: ${{ secrets.APP_ID }}
          RELEASE_LINE: ${{ inputs.release_line }}
          DRY_RUN: ${{ inputs.dry_run }}
          ADMIN_WRITE: ${{ steps.admin_token.outcome == 'success' }}
          CAN_CREATE_BRANCH: "true"
          COORDINATOR_DIR: coordinator
        run: python3 .github/scripts/prepare_release_line.py
