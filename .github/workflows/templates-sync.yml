name: Workflow templates sync
on:
  push:
    paths:
      - ".github/workflows/templates-sync.yml"
      - "repos/**.json"
      - "workflow-templates/**.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  templates-sync:
    # limit push on peeweep-test/.github main branch
    if: github.repository == 'peeweep-test/.github' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      # Incremental sync when config changed
      - name: Get changed configs
        id: changed-configs
        uses: tj-actions/changed-files@v16
        with:
          separator: " "
          files: |
            repos/peeweep-test/*.json
      # Full sync when file changed or workflow_dispatch event
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v16
        with:
          separator: " "
          files: |
            workflow-templates/*.yml
            .github/workflows/templates-sync.yml

      # Use a scoped bot token over HTTPS in the test organization.
      - name: Git config
        env:
          TEST_SYNC_TOKEN: ${{ secrets.TEST_SYNC_TOKEN }}
        run: |
          git config --global url."https://MyLeeJiEun:${TEST_SYNC_TOKEN}@github.com/".insteadOf git@github.com:
          git config --global user.name deepin-admin-bot
          git config --global user.email deepin-admin-bot@deepin.org

      - name: Sync changed configs
        uses: linuxdeepin/action-sync@main
        if: steps.changed-configs.outputs.any_changed == 'true'
        with:
          files: "${{ steps.changed-configs.outputs.all_changed_files }}"
          message: |
            chore: Sync by ${{ github.event.head_commit.url }}

            sync by github workflow

            Log: none
            Influence: none

      - name: Get all configs
        id: all-configs
        if: (steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch') && hashFiles('repos/peeweep-test/*.json') != ''
        run: |
          all_configs=`find repos/peeweep-test -type f | grep json | xargs`
          echo all configs $all_configs
          echo "ALL_CONFIGS=$all_configs" >> $GITHUB_OUTPUT
      - name: Sync all files
        uses: linuxdeepin/action-sync@main
        if: (steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch') && hashFiles('repos/peeweep-test/*.json') != ''
        with:
          files: "${{ steps.all-configs.outputs.ALL_CONFIGS }}"
          message: |
            chore: Sync by ${{ github.event.head_commit.url }}

            sync by github workflow

            Log: none
            Influence: none
